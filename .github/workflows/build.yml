# Builds the downloadable app for Windows, macOS and Linux.
# Push a tag like v1.0.0 to publish a release, or start it by hand from the Actions tab.
name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: VoxChat-Windows
          - os: macos-latest
            name: VoxChat-macOS
          - os: ubuntu-22.04
            name: VoxChat-Linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Audio library (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2
      - name: Install
        run: |
          uv venv --python 3.12
          uv pip install --require-hashes -r requirements.lock
      - name: Stamp version
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "$GITHUB_REF_NAME" > assets/version.txt  # the app compares it with the latest release
      - name: Build
        run: uv run --with pyinstaller==6.22.3 pyinstaller --noconfirm voxchat.spec
      - name: Package
        run: |
          case "$RUNNER_OS" in
            Windows) 7z a "../${{ matrix.name }}.zip" ./dist/VoxChat ;;
            macOS) ditto -c -k --keepParent dist/VoxChat.app "../${{ matrix.name }}.zip" ;;
            Linux) tar -czf "../${{ matrix.name }}.tar.gz" -C dist VoxChat ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" VoxChat-* --repo "$GITHUB_REPOSITORY" --title "VoxChat $GITHUB_REF_NAME" --generate-notes

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>VoxChat</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171d3a"/>
      <stop offset="1" stop-color="#070a14"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.47" r="0.5">
      <stop offset="0" stop-color="#6b4dff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6b4dff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neon" x1="0.1" y1="0.9" x2="0.9" y2="0.1">
      <stop offset="0" stop-color="#2ee6ff"/>
      <stop offset="0.4" stop-color="#4a7dff"/>
      <stop offset="0.7" stop-color="#8a5cff"/>
      <stop offset="1" stop-color="#ff4fd8"/>
    </linearGradient>
    <linearGradient id="bars" gradientUnits="userSpaceOnUse" x1="0" y1="170" x2="0" y2="310">
